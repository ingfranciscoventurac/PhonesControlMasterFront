<div class="flex p-4 pb-0 justify-between items-center">
    <span class="text-xl font-bold">Editar Proxy</span>
    <div class="cursor-pointer" (click)="closeModal()">
        <svg transform="scale(1.5)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-x">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M18 6l-12 12" />
            <path d="M6 6l12 12" />
        </svg>
    </div>
</div>
<div class="p-4">
    <div class="flex flex-col gap-4">
        <form [formGroup]="editProxyForm" (submit)="saveNewLicense()">
            <div class="flex flex-col gap-4">
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="form-label">Origen</label>
                        <select class="form-select" formControlName="origin">
                            <option [value]="'Decodo'">Decodo</option>
                            <option [value]="'Granja Proxy'">Granja Proxy</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-2">

                    <div class="flex-1">
                        <label class="form-label">IP</label>
                        <input type="text" class="form-control" name="example-text-input" placeholder="|"
                            formControlName="ip">
                    </div>
                    <div class="flex-1">
                        <label class="form-label">Puerto</label>
                        <input type="text" class="form-control" name="example-text-input" placeholder="|"
                            formControlName="port">
                    </div>
                </div>

                <div class="flex gap-2">


                    <div class="flex-1">
                        <label class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" name="example-text-input" placeholder="|"
                            formControlName="userName">
                    </div>

                    <div class="flex-1">
                        <label class="form-label">Contraseña</label>
                        <input type="text" class="form-control" name="example-text-input" placeholder="|"
                            formControlName="password">
                    </div>
                </div>
                <div class="flex flex-row">
                    <button class="btn flex-1" type="submit">Guardar</button>
                </div>

            </div>
        </form>
    </div>
</div>
